<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | ElectroCompare</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <div id="toastContainer" class="toast-container"></div>

    <nav class="navbar glass" id="navbar">
        <div class="nav-left">
            <div class="logo">ELECTRO<span>COMPARE</span></div>
            <div class="nav-links">
                <a href="index.html" class="nav-item">Home</a>
                <a href="products.html" class="nav-item">Products</a>
                <a href="compare.html" class="nav-item">Compare</a>
                <a href="contact.html" class="nav-item">Contact</a>
            </div>
        </div>
        
        <div class="search-bar">
            <i data-lucide="search" size="18"></i>
            <input type="text" placeholder="Search gadgets, brands...">
        </div>

        <div class="nav-actions">
            <a href="wishlist.html" class="nav-item"><i data-lucide="heart"></i></a>
            <a href="cart.html" class="cart-icon">
                <i data-lucide="shopping-cart"></i>
                <span class="cart-count">0</span>
            </a>
            <a href="login.html" class="btn btn-outline">Login</a>
            <a href="register.html" class="btn btn-primary">Join Now</a>
        </div>
    </nav>

    <div class="auth-container">
        <div class="auth-box">
            <a href="index.html" class="auth-back-link"><i data-lucide="arrow-left" size="16"></i> Back to Home</a>
            <h3>Create Account</h3>
            <form id="registerForm" novalidate>
                <div class="form-row">
                    <div class="form-group">
                        <label>First Name</label>
                        <div class="input-wrapper">
                            <i data-lucide="user" size="18"></i>
                            <input type="text" id="firstName" placeholder="John" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Last Name</label>
                        <div class="input-wrapper">
                            <i data-lucide="user" size="18"></i>
                            <input type="text" id="lastName" placeholder="Doe" required>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <label>Phone Number</label>
                    <div class="input-wrapper">
                        <i data-lucide="phone" size="18"></i>
                        <input type="tel" id="phone" placeholder="+1 (555) 000-0000" required>
                    </div>
                </div>

                <div class="form-group">
                    <label>Email Address</label>
                    <div class="input-wrapper">
                        <i data-lucide="mail" size="18"></i>
                        <input type="email" id="email" placeholder="john@example.com" required>
                    </div>
                </div>
                
                <div class="form-group">
                    <label>Shipping Address</label>
                    <div class="input-wrapper">
                        <i data-lucide="map-pin" size="18" class="textarea-icon"></i>
                        <textarea id="address" placeholder="123 Main St, City, Country" required></textarea>
                    </div>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <div class="input-wrapper">
                        <i data-lucide="lock" size="18"></i>
                        <input type="password" id="password" placeholder="••••••••" required>
                    </div>
                </div>

                <div style="margin-top: 1.5rem; margin-bottom: 1.5rem; font-size: 0.85rem; display: flex; align-items: center; gap: 0.5rem; justify-content: center;">
                    <input type="checkbox" id="terms" required style="accent-color: var(--sky-blue); transform: scale(1.2);">
                    <label for="terms" style="margin: 0; color: var(--dark-text); font-weight: 500;">I agree to the <a href="#" style="color: var(--sky-blue); font-weight: 600;">Terms & Conditions</a></label>
                </div>
                
                <button type="submit" class="btn btn-primary" style="width: 100%; padding: 1rem;">Create Account</button>
            </form>

            <div class="divider">
                <span>OR</span>
            </div>

            <div class="social-login">
                <button class="btn-social" type="button">
                    <svg viewBox="0 0 24 24" width="20" height="20" xmlns="http://www.w3.org/2000/svg"><g transform="matrix(1, 0, 0, 1, 27.009001, -39.238998)"><path fill="#4285F4" d="M -3.264 51.509 C -3.264 50.719 -3.334 49.969 -3.454 49.239 L -14.754 49.239 L -14.754 53.749 L -8.284 53.749 C -8.574 55.229 -9.424 56.479 -10.684 57.329 L -10.684 60.329 L -6.824 60.329 C -4.564 58.239 -3.264 55.159 -3.264 51.509 Z"/><path fill="#34A853" d="M -14.754 63.239 C -11.514 63.239 -8.804 62.159 -6.824 60.329 L -10.684 57.329 C -11.764 58.049 -13.134 58.489 -14.754 58.489 C -17.884 58.489 -20.534 56.379 -21.484 53.529 L -25.464 53.529 L -25.464 56.619 C -23.494 60.539 -19.444 63.239 -14.754 63.239 Z"/><path fill="#FBBC05" d="M -21.484 53.529 C -21.734 52.809 -21.864 52.039 -21.864 51.239 C -21.864 50.439 -21.724 49.669 -21.484 48.949 L -21.484 45.859 L -25.464 45.859 C -26.284 47.479 -26.754 49.299 -26.754 51.239 C -26.754 53.179 -26.284 54.999 -25.464 56.619 L -21.484 53.529 Z"/><path fill="#EA4335" d="M -14.754 43.989 C -12.984 43.989 -11.404 44.599 -10.154 45.789 L -6.734 42.369 C -8.804 40.429 -11.514 39.239 -14.754 39.239 C -19.444 39.239 -23.494 41.939 -25.464 45.859 L -21.484 48.949 C -20.534 46.099 -17.884 43.989 -14.754 43.989 Z"/></g></svg>
                    Continue with Google
                </button>
            </div>

            <div class="auth-footer">
                Already have an account? <a href="login.html">Login here</a>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();

        function showToast(message, type = 'error') {
            const container = document.getElementById('toastContainer');
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            
            const icon = type === 'error' ? 'alert-circle' : 'check-circle';
            
            toast.innerHTML = `
                <i data-lucide="${icon}"></i>
                <div class="toast-message">${message}</div>
            `;
            
            container.appendChild(toast);
            lucide.createIcons();

            setTimeout(() => toast.classList.add('show'), 10);

            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 400); 
            }, 4000);
        }

        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const firstName = document.getElementById('firstName').value.trim();
            const lastName = document.getElementById('lastName').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const email = document.getElementById('email').value.trim();
            const address = document.getElementById('address').value.trim();
            const password = document.getElementById('password').value;
            const terms = document.getElementById('terms').checked;

            if (!firstName || !lastName || !phone || !email || !address || !password) {
                showToast('Please fill in all required fields.');
                return;
            }

            // Name validation (letters and spaces only)
            const nameRegex = /^[A-Za-z\s]+$/;
            if (!nameRegex.test(firstName)) {
                showToast('Please enter a valid First Name (letters only).');
                return;
            }
            if (!nameRegex.test(lastName)) {
                showToast('Please enter a valid Last Name (letters only).');
                return;
            }

            // Basic email validation
            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!emailRegex.test(email)) {
                showToast('Please enter a valid email address.');
                return;
            }

            // Phone validation
            const phoneRegex = /^[0-9+\-\s()]{10,15}$/;
            if (!phoneRegex.test(phone)) {
                showToast('Please enter a valid phone number (10-15 digits).');
                return;
            }

            if (password.length < 8) {
                showToast('Password must be at least 8 characters long.');
                return;
            }

            if (!terms) {
                showToast('You must agree to the Terms & Conditions.');
                return;
            }

            showToast('Account created successfully!', 'success');
            
            // Save mock user data for login testing
            const mockUser = {
                firstName: firstName,
                lastName: lastName,
                email: email,
                phone: phone,
                address: address
            };
            localStorage.setItem('electroUser_temp', JSON.stringify(mockUser));

            setTimeout(() => {
                window.location.href = 'login.html';
            }, 1500);
        });
    </script>
</body>
</html>
