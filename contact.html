<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | ElectroCompare</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .contact-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 4rem;
            padding-top: 10rem;
        }

        .contact-info-card {
            background: var(--purple-grad);
            color: white;
            padding: 3rem;
            border-radius: 24px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .contact-details {
            margin-top: 2rem;
        }

        .contact-item {
            display: flex;
            align-items: center;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .contact-item i {
            background: rgba(255, 255, 255, 0.2);
            padding: 1rem;
            border-radius: 12px;
        }

        .contact-form-side {
            background: white;
            padding: 3rem;
            border-radius: 24px;
            box-shadow: var(--shadow-soft);
        }

        @media (max-width: 768px) {
            .contact-container { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <nav class="navbar glass scrolled">
        <a href="index.html" class="logo">ElectroCompare</a>
        <div class="nav-links">
            <a href="index.html" class="nav-item">Home</a>
            <a href="products.html" class="nav-item">Products</a>
            <a href="contact.html" class="nav-item" style="color: var(--sky-blue)">Contact</a>
        </div>
    </nav>

    <div class="section-padding contact-container">
        <div class="contact-info-card">
            <h2>Get in Touch</h2>
            <p>Have questions about a gadget comparison or need help with your order? Our team is here for you.</p>
            
            <div class="contact-details">
                <div class="contact-item">
                    <i data-lucide="mail"></i>
                    <div>
                        <p style="font-weight: 500;">Support Email</p>
                        <p style="opacity: 0.8;">support@electrocompare.com</p>
                    </div>
                </div>
                <div class="contact-item">
                    <i data-lucide="phone"></i>
                    <div>
                        <p style="font-weight: 500;">Phone Line</p>
                        <p style="opacity: 0.8;">+1 (888) 123-4567</p>
                    </div>
                </div>
                <div class="contact-item">
                    <i data-lucide="map-pin"></i>
                    <div>
                        <p style="font-weight: 500;">HQ Address</p>
                        <p style="opacity: 0.8;">123 Tech Avenue, Silicon Valley, CA</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="contact-form-side">
            <h3>Send Message</h3>
            <form style="margin-top: 2rem;">
                <div class="form-group">
                    <label>Your Name</label>
                    <div class="input-wrapper">
                        <i data-lucide="user" size="18" style="padding-left:0.5rem"></i>
                        <input type="text" placeholder="John Doe" style="padding-left:2.5rem">
                    </div>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <div class="input-wrapper">
                        <i data-lucide="mail" size="18" style="padding-left:0.5rem"></i>
                        <input type="email" placeholder="name@example.com" style="padding-left:2.5rem">
                    </div>
                </div>
                <div class="form-group">
                    <label>Subject</label>
                    <div class="input-wrapper">
                        <select style="width:100%; padding:0.8rem; border-radius:12px; border:1px solid #E2E8F0; background:white;">
                            <option>Product Comparison Help</option>
                            <option>Order Status</option>
                            <option>Returns & Refunds</option>
                            <option>General Inquiry</option>
                        </select>
                    </div>
                </div>
                <div class="form-group">
                    <label>Message</label>
                    <textarea placeholder="How can we help you?" style="width:100%; height:150px; padding:1rem; border-radius:12px; border:1px solid #E2E8F0; resize:none; font-family:inherit;"></textarea>
                </div>
                <button type="submit" class="btn btn-primary" style="width:100%;">Send Message</button>
            </form>
        </div>
    </div>

    <script>lucide.createIcons();</script>
</body>
</html>
