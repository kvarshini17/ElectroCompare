<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products | ElectroCompare</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .products-page {
            display: flex;
            gap: 3rem;
            padding-top: 120px;
        }

        .filter-sidebar {
            width: 280px;
            flex-shrink: 0;
            position: sticky;
            top: 100px;
            height: calc(100vh - 150px);
            overflow-y: auto;
            padding-right: 1rem;
        }

        .filter-group {
            margin-bottom: 2.5rem;
        }

        .filter-group h4 {
            font-size: 1rem;
            font-weight: 700;
            margin-bottom: 1.2rem;
            color: var(--dark-text);
        }

        .filter-item {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            margin-bottom: 0.8rem;
            cursor: pointer;
            color: var(--muted-text);
            font-size: 0.95rem;
        }

        .filter-item input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .price-range {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .price-range input[type="range"] {
            width: 100%;
        }

        .products-content {
            flex: 1;
        }

        .content-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 2rem;
        }

        .sort-dropdown select {
            padding: 0.6rem 1.2rem;
            border-radius: 12px;
            border: 1px solid #E2E8F0;
            outline: none;
            background: var(--white);
            font-family: inherit;
        }

        @media (max-width: 992px) {
            .products-page { flex-direction: column; }
            .filter-sidebar { width: 100%; height: auto; position: static; padding-right: 0; }
        }
    </style>
</head>
<body>
    <div id="toastContainer" class="toast-container"></div>
    <!-- Navbar (Shared) -->
    <nav class="navbar glass scrolled" id="navbar">
        <a href="index.html" class="logo">ElectroCompare</a>
        <div class="nav-links">
            <a href="index.html" class="nav-item">Home</a>
            <a href="products.html" class="nav-item" style="color: var(--sky-blue)">Products</a>
            <a href="compare.html" class="nav-item">Compare</a>
        </div>
        <div class="search-bar">
            <i data-lucide="search" size="18"></i>
            <input type="text" placeholder="Search gadgets...">
        </div>
        <div class="nav-actions">
            <a href="wishlist.html" class="nav-item"><i data-lucide="heart"></i></a>
            <a href="cart.html" class="cart-icon">
                <i data-lucide="shopping-cart"></i>
                <span class="cart-count">0</span>
            </a>
            <a href="login.html" class="btn btn-outline">Login</a>
        </div>
    </nav>

    <div class="section-padding products-page">
        <!-- Sidebar Filter -->
        <aside class="filter-sidebar">
            <div style="background: white; padding: 1.5rem; border-radius: 20px; border: 1px solid #F1F5F9; box-shadow: var(--shadow-soft);">
                <div class="filter-group">
                    <h4>Categories</h4>
                    <label class="filter-item"><input type="checkbox" class="category-filter" value="smartphones" checked> <span>Smartphones</span></label>
                    <label class="filter-item"><input type="checkbox" class="category-filter" value="laptops" checked> <span>Laptops</span></label>
                    <label class="filter-item"><input type="checkbox" class="category-filter" value="earbuds" checked> <span>Earbuds</span></label>
                    <label class="filter-item"><input type="checkbox" class="category-filter" value="watch" checked> <span>Watch</span></label>
                </div>

                <div class="filter-group">
                    <h4>Price Range</h4>
                    <div class="price-range">
                        <input type="range" min="0" max="300000" value="300000" id="priceRange" step="1000">
                        <div style="display: flex; justify-content: space-between; font-size: 0.9rem; color: var(--muted-text);">
                            <span>₹0</span>
                            <span id="priceValue">₹3,00,000</span>
                        </div>
                    </div>
                </div>

                <div class="filter-group">
                    <h4>Brands</h4>
                    <label class="filter-item"><input type="checkbox" class="brand-filter" value="Apple" checked> <span>Apple</span></label>
                    <label class="filter-item"><input type="checkbox" class="brand-filter" value="Samsung" checked> <span>Samsung</span></label>
                    <label class="filter-item"><input type="checkbox" class="brand-filter" value="Google" checked> <span>Google</span></label>
                    <label class="filter-item"><input type="checkbox" class="brand-filter" value="Dell" checked> <span>Dell</span></label>
                    <label class="filter-item"><input type="checkbox" class="brand-filter" value="Sony" checked> <span>Sony</span></label>
                    <label class="filter-item"><input type="checkbox" class="brand-filter" value="Microsoft" checked> <span>Microsoft</span></label>
                    <label class="filter-item"><input type="checkbox" class="brand-filter" value="Garmin" checked> <span>Garmin</span></label>
                </div>

                <div class="filter-group" style="margin-bottom: 0;">
                    <h4>Rating</h4>
                    <label class="filter-item"><input type="checkbox" class="rating-filter" value="4.5"> <span>4.5 & Above</span></label>
                    <label class="filter-item"><input type="checkbox" class="rating-filter" value="4.0"> <span>4.0 & Above</span></label>
                    <label class="filter-item"><input type="checkbox" class="rating-filter" value="3.5"> <span>3.5 & Above</span></label>
                </div>
            </div>
        </aside>

        <!-- Product Content -->
        <main class="products-content">
            <div class="content-header">
                <h3>Showing Products</h3>
                <div class="sort-dropdown">
                    <span style="font-size: 0.9rem; color: var(--muted-text); margin-right: 0.5rem;">Sort by:</span>
                    <select>
                        <option>Newest Arrivals</option>
                        <option>Price: Low to High</option>
                        <option>Price: High to Low</option>
                        <option>Most Reviewed</option>
                    </select>
                </div>
            </div>

            <div class="product-grid" id="productContainer">
                <!-- Products dynamically injected -->
            </div>
        </main>
    </div>

    <!-- Footer -->
    <footer>
        <div class="footer-bottom">
            <p>&copy; 2026 ElectroCompare. Pure Innovation.</p>
        </div>
    </footer>

    <script src="/js/data.js"></script>
    <script src="/js/script.js"></script>
    <script>
        const formatCurrency = (num) => '₹' + num.toLocaleString('en-IN');
        
        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            if(!container) return;
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icon = type === 'error' ? 'alert-circle' : 'check-circle';
            toast.innerHTML = `<i data-lucide="${icon}"></i><div class="toast-message">${message}</div>`;
            container.appendChild(toast);
            if(typeof lucide !== 'undefined') lucide.createIcons();
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => { toast.classList.remove('show'); setTimeout(() => toast.remove(), 400); }, 3000);
        }

        // Render products
        const container = document.getElementById('productContainer');
        const wishlistIds = window.electroWishlist || [];
        const compareIds = window.electroCompare || [];
        
        Object.values(window.productsData).forEach(p => {
            const card = document.createElement('div');
            card.className = 'product-card';
            card.dataset.category = p.category;
            card.dataset.brand = p.brand;
            card.dataset.price = p.price;
            card.dataset.rating = p.rating;
            card.onclick = () => window.location.href = `product-details.html?id=${p.id}`;
            card.style.cursor = 'pointer';
            
            const isWishlisted = wishlistIds.includes(p.id);
            const heartFill = isWishlisted ? '#EF4444' : 'none';
            const heartColor = isWishlisted ? '#EF4444' : 'currentColor';

            const isCompared = compareIds.includes(p.id);
            const compareClass = isCompared ? 'action-btn btn-compare active' : 'action-btn btn-compare';
            const compareStyle = isCompared ? 'background-color: var(--sky-blue); color: white;' : '';
            const compareIconColor = isCompared ? 'white' : 'currentColor';

            card.innerHTML = `
                <div class="product-image">
                    <img src="${p.image}" alt="${p.title}" referrerpolicy="no-referrer">
                </div>
                <div class="product-info">
                    <span class="brand">${p.brand}</span>
                    <h3>${p.title}</h3>
                    <div class="rating">
                        <i data-lucide="star" fill="#FFB800" size="14"></i>
                        <span>${p.rating} (${p.reviews})</span>
                    </div>
                    <div class="price-row">
                        <span class="price">${formatCurrency(p.price)}</span>
                        <div style="display:flex; gap:0.5rem">
                            <button class="action-btn btn-wishlist" onclick="globalAddToWishlist('${p.id}', this)"><i data-lucide="heart" size="18" fill="${heartFill}" color="${heartColor}"></i></button>
                            <button class="${compareClass}" style="${compareStyle}" onclick="globalToggleCompare('${p.id}', this)"><i data-lucide="git-compare" size="18" color="${compareIconColor}"></i></button>
                        </div>
                    </div>
                    <button class="action-btn btn-cart" style="width:100%; margin-top:1rem" onclick="globalAddToCart('${p.id}', this)">Add to Cart</button>
                </div>
            `;
            container.appendChild(card);
        });

        lucide.createIcons();
        
        // Price Range Update
        const range = document.getElementById('priceRange');
        const val = document.getElementById('priceValue');
        range.addEventListener('input', () => {
            val.textContent = '₹' + parseInt(range.value).toLocaleString('en-IN');
        });
    </script>
</body>
</html>
