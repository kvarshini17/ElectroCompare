<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Compare Products | ElectroCompare</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .compare-header {
            text-align: center;
            padding: 10rem 5% 4rem;
            background: var(--soft-blue);
        }

        .compare-table-container {
            padding: 4rem 5%;
            overflow-x: auto;
            min-height: 50vh;
        }

        .compare-table {
            width: 100%;
            border-collapse: collapse;
            background: white;
            border-radius: 24px;
            overflow: hidden;
            box-shadow: var(--shadow-soft);
        }

        .compare-table th, .compare-table td {
            padding: 1.5rem;
            text-align: center;
            border-bottom: 1px solid #F1F5F9;
        }

        .compare-table th {
            background: var(--light-gray);
            font-weight: 700;
            color: var(--dark-text);
        }

        .spec-label {
            text-align: left !important;
            font-weight: 600;
            color: var(--muted-text);
            width: 200px;
        }

        .product-col {
            min-width: 250px;
            width: 250px;
        }

        .product-header {
            display: flex;
            flex-direction: column;
            align-items: center;
            position: relative;
        }

        .product-header img {
            max-width: 150px;
            height: 150px;
            object-fit: contain;
            margin-bottom: 1rem;
            transition: transform 0.3s ease;
        }

        .product-header:hover img {
            transform: scale(1.05);
        }

        .better-spec {
            background-color: #F0FDF4;
            color: #15803D;
            font-weight: 700;
            position: relative;
        }

        .better-spec::after {
            content: 'Best';
            position: absolute;
            top: 5px;
            right: 5px;
            font-size: 10px;
            background: #22C55E;
            color: white;
            padding: 2px 6px;
            border-radius: 10px;
        }

        .remove-btn {
            color: #EF4444;
            cursor: pointer;
            font-size: 0.8rem;
            margin-top: 0.5rem;
            display: inline-block;
            transition: color 0.2s;
        }

        .remove-btn:hover {
            color: #DC2626;
            text-decoration: underline;
        }

        .add-compare-slot {
            border: 2px dashed #CBD5E1;
            border-radius: 12px;
            padding: 2rem;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
            color: var(--muted-text);
            cursor: pointer;
            transition: all 0.3s ease;
            height: 100%;
            justify-content: center;
        }

        .add-compare-slot:hover {
            border-color: var(--sky-blue);
            color: var(--sky-blue);
            background: var(--soft-blue);
        }

        .empty-compare {
            text-align: center;
            padding: 4rem 2rem;
            background: white;
            border-radius: 24px;
            box-shadow: var(--shadow-soft);
        }
        
        .empty-compare i {
            margin-bottom: 1.5rem;
            color: #CBD5E1;
        }

        .empty-compare h2 {
            font-size: 2rem;
            margin-bottom: 1rem;
        }

        .empty-compare p {
            color: var(--muted-text);
            margin-bottom: 2rem;
        }
    </style>
</head>
<body>
    <div id="toastContainer" class="toast-container"></div>

    <nav class="navbar glass scrolled" id="navbar">
        <div class="nav-left">
            <a href="index.html" class="logo">ELECTRO<span>COMPARE</span></a>
            <div class="nav-links">
                <a href="index.html" class="nav-item">Home</a>
                <a href="products.html" class="nav-item">Products</a>
                <a href="compare.html" class="nav-item" style="color: var(--sky-blue); font-weight: 600;">Compare</a>
            </div>
        </div>
        <div class="nav-actions">
            <a href="wishlist.html" class="nav-item"><i data-lucide="heart"></i></a>
            <a href="cart.html" class="cart-icon">
                <i data-lucide="shopping-cart"></i>
                <span class="cart-count">0</span>
            </a>
            <a href="login.html" class="btn btn-primary">Login</a>
        </div>
    </nav>

    <header class="compare-header">
        <h1>Product Comparison</h1>
        <p>Analyze technical specifications side-by-side to find your perfect match.</p>
    </header>

    <main class="compare-table-container" id="compareContainer">
        <!-- Rendered via JS -->
    </main>

    <script src="/js/data.js"></script>
    <script src="/js/script.js"></script>
    <script>
        // Formatter
        const formatCurrency = (num) => new Intl.NumberFormat('en-IN', { style: 'currency', currency: 'INR', maximumFractionDigits: 0 }).format(num);

        function removeFromCompare(id) {
            globalToggleCompare(id);
            renderCompare();
        }

        function renderCompare() {
            const container = document.getElementById('compareContainer');
            const compareIds = window.electroCompare || [];

            if (compareIds.length === 0) {
                container.innerHTML = `
                    <div class="empty-compare">
                        <i data-lucide="git-compare" size="64"></i>
                        <h2>Nothing to compare yet</h2>
                        <p>Go to the products page to select items you want to compare side-by-side.</p>
                        <a href="products.html" class="btn btn-primary">Browse Products</a>
                    </div>
                `;
                lucide.createIcons();
                return;
            }

            const products = compareIds.map(id => window.productsData[id]).filter(Boolean);
            
            // Extract all unique spec keys
            const allSpecLabels = [];
            products.forEach(p => {
                p.specs.forEach(s => {
                    if (!allSpecLabels.includes(s.label)) allSpecLabels.push(s.label);
                });
            });

            // Analyze Best Specs (where applicable)
            const bestValues = {};
            // Keys from data.js: ram, battery, camera, storage
            const specKeysToCompare = ['ram', 'battery', 'camera', 'storage'];
            specKeysToCompare.forEach(key => {
                let max = -1;
                products.forEach(p => {
                    if (p.compareValues && p.compareValues[key] !== undefined) {
                        if (p.compareValues[key] > max) max = p.compareValues[key];
                    }
                });
                bestValues[key] = max;
            });

            let cheapestPrice = Infinity;
            products.forEach(p => { if (p.price < cheapestPrice) cheapestPrice = p.price; });

            // Render Header Row
            let html = `
                <table class="compare-table">
                    <thead>
                        <tr>
                            <th class="spec-label">Feature</th>
            `;

            products.forEach(p => {
                html += `
                            <th class="product-col">
                                <div class="product-header">
                                    <img src="${p.image}" alt="${p.title}" referrerpolicy="no-referrer">
                                    <h3>${p.title}</h3>
                                    <span class="remove-btn" onclick="removeFromCompare('${p.id}')">Remove</span>
                                </div>
                            </th>
                `;
            });

            // Render Add Slots up to 4
            for (let i = products.length; i < 4; i++) {
                html += `
                            <th class="product-col">
                                <a href="products.html" style="text-decoration:none;">
                                    <div class="add-compare-slot">
                                        <i data-lucide="plus-circle" size="32"></i>
                                        <span>Add Product</span>
                                    </div>
                                </a>
                            </th>
                `;
            }

            html += `
                        </tr>
                    </thead>
                    <tbody>
            `;

            // Render Price Row
            html += `<tr><td class="spec-label">Price</td>`;
            products.forEach(p => {
                const isBest = p.price === cheapestPrice && products.length > 1;
                const cls = isBest ? 'better-spec' : '';
                html += `<td class="${cls}">${formatCurrency(p.price)}</td>`;
            });
            for (let i = products.length; i < 4; i++) html += `<td>-</td>`;
            html += `</tr>`;

            // Render Spec Rows
            allSpecLabels.forEach(label => {
                html += `<tr><td class="spec-label">${label}</td>`;
                
                products.forEach(p => {
                    const specObj = p.specs.find(s => s.label === label);
                    let val = specObj ? specObj.value : '-';
                    let cls = '';
                    
                    if (specObj && p.compareValues) {
                        // Figure out if it's best based on mapped IDs
                        const mapLabelToId = {
                            "RAM": "ram",
                            "Battery": "battery",
                            "Camera": "camera",
                            "Storage": "storage"
                        };
                        const cid = mapLabelToId[label];
                        if (cid && bestValues[cid] !== -1 && p.compareValues[cid] === bestValues[cid] && products.length > 1) {
                            cls = 'better-spec';
                        }
                    }
                    html += `<td class="${cls}">${val}</td>`;
                });
                
                for (let i = products.length; i < 4; i++) html += `<td>-</td>`;
                html += `</tr>`;
            });

            // Action Row
            html += `<tr><td class="spec-label">Action</td>`;
            products.forEach(p => {
                html += `<td><button class="btn btn-primary" onclick="globalAddToCart('${p.id}', this)">Add to Cart</button></td>`;
            });
            for (let i = products.length; i < 4; i++) html += `<td>-</td>`;
            html += `</tr>`;

            html += `
                    </tbody>
                </table>
            `;

            container.innerHTML = html;
            lucide.createIcons();
        }

        // Global override for showToast locally here if it doesn't exist
        if (typeof showToast !== 'function') {
            window.showToast = function(message, type = 'success') {
                const container = document.getElementById('toastContainer');
                if (!container) return;
                const toast = document.createElement('div');
                toast.className = `toast toast-${type}`;
                toast.innerHTML = `
                    <i data-lucide="${type === 'success' ? 'check-circle' : 'alert-circle'}"></i>
                    <span>${message}</span>
                `;
                container.appendChild(toast);
                lucide.createIcons();
                setTimeout(() => toast.classList.add('show'), 10);
                setTimeout(() => {
                    toast.classList.remove('show');
                    setTimeout(() => toast.remove(), 300);
                }, 3000);
            };
        }

        document.addEventListener('DOMContentLoaded', renderCompare);
    </script>
</body>
</html>
