<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | ElectroCompare</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .auth-container {
            display: flex;
            min-height: 100vh;
        }

        .auth-image {
            flex: 1.2;
            background: linear-gradient(135deg, #A855F7 0%, #6366F1 100%);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            padding: 4rem;
            text-align: center;
        }

        .auth-image h2 {
            font-size: 3rem;
            margin-bottom: 1.5rem;
            font-weight: 800;
        }

        .auth-image p {
            font-size: 1.2rem;
            opacity: 0.9;
        }

        .auth-form-side {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--white);
            padding: 4rem;
        }

        .auth-box {
            width: 100%;
            max-width: 400px;
        }

        .auth-box h3 {
            font-size: 2rem;
            margin-bottom: 2rem;
            font-weight: 700;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            font-weight: 500;
            color: var(--muted-text);
            font-size: 0.9rem;
        }

        .input-wrapper {
            position: relative;
        }

        .input-wrapper i {
            position: absolute;
            left: 1rem;
            top: 50%;
            transform: translateY(-50%);
            color: var(--muted-text);
        }

        .input-wrapper input {
            width: 100%;
            padding: 0.8rem 1rem 0.8rem 3rem;
            border-radius: 12px;
            border: 1px solid #E2E8F0;
            outline: none;
            transition: all 0.3s ease;
            font-size: 1rem;
        }

        .input-wrapper input:focus {
            border-color: var(--sky-blue);
            box-shadow: 0 0 0 4px rgba(96, 165, 250, 0.1);
        }

        .auth-footer {
            margin-top: 2rem;
            text-align: center;
            color: var(--muted-text);
            font-size: 0.95rem;
        }

        .auth-footer a {
            color: var(--sky-blue);
            font-weight: 600;
        }

        @media (max-width: 992px) {
            .auth-image { display: none; }
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-image">
            <div data-lucide="shield-check" size="100" style="margin-bottom: 2rem;"></div>
            <h2>Secure Comparisons</h2>
            <p>Access your wishlist, comparison history, and exclusive deals by logging into your ElectroCompare account.</p>
        </div>
        <div class="auth-form-side">
            <div class="auth-box">
                <a href="index.html" class="logo" style="display:inline-block; margin-bottom: 2rem;">ElectroCompare</a>
                <h3>Login to Account</h3>
                <form id="loginForm">
                    <div class="form-group">
                        <label>Email Address</label>
                        <div class="input-wrapper">
                            <i data-lucide="mail" size="18"></i>
                            <input type="email" placeholder="name@example.com" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Password</label>
                        <div class="input-wrapper">
                            <i data-lucide="lock" size="18"></i>
                            <input type="password" placeholder="••••••••" required>
                        </div>
                    </div>
                    <div style="text-align: right; margin-bottom: 1.5rem;">
                        <a href="#" style="font-size: 0.85rem; color: var(--sky-blue);">Forgot Password?</a>
                    </div>
                    <button type="submit" class="btn btn-primary" style="width: 100%;">Sign In</button>
                </form>
                <div class="auth-footer">
                    Don't have an account? <a href="register.html">Create Account</a>
                </div>
            </div>
        </div>
    </div>

    <script>
        lucide.createIcons();
    </script>
</body>
</html>
