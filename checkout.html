<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout | ElectroCompare</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .checkout-page {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 3rem;
            padding-top: 10rem;
            max-width: 1200px;
            margin: 0 auto;
            padding-bottom: 6rem;
        }

        .checkout-section {
            background: var(--white);
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: var(--shadow-soft);
            border: 1px solid #F1F5F9;
            margin-bottom: 2rem;
        }

        .checkout-section h3 {
            font-size: 1.3rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            border-bottom: 1px solid #E2E8F0;
            padding-bottom: 1rem;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
        }

        .form-group.full {
            grid-column: 1 / -1;
        }

        .cc-mockup {
            background: linear-gradient(135deg, #1e293b 0%, #0f172a 100%);
            border-radius: 16px;
            padding: 1.5rem;
            color: white;
            margin-bottom: 2rem;
            box-shadow: 0 15px 35px rgba(15, 23, 42, 0.3);
            position: relative;
            overflow: hidden;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .cc-mockup:hover {
            transform: translateY(-5px);
            box-shadow: 0 20px 40px rgba(15, 23, 42, 0.4);
        }

        .cc-mockup::before {
            content: '';
            position: absolute;
            top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(to right, transparent, rgba(255,255,255,0.1), transparent);
            transform: skewX(-20deg);
            animation: ccShine 6s infinite;
        }

        @keyframes ccShine {
            0% { left: -100%; }
            20% { left: 200%; }
            100% { left: 200%; }
        }

        .cc-mockup::after {
            content: '';
            position: absolute;
            top: 0;
            right: 0;
            width: 150px;
            height: 150px;
            background: rgba(255,255,255,0.05);
            border-radius: 50%;
            transform: translate(30%, -30%);
        }

        .cc-chip {
            width: 40px;
            height: 30px;
            background: #cbd5e1;
            border-radius: 6px;
            margin-bottom: 1.5rem;
        }

        .input-wrapper input:focus {
            background: #F8FAFC;
        }
        
        .input-wrapper:focus-within {
            box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.2);
            border-color: var(--sky-blue);
        }
        
        .input-wrapper:focus-within i {
            color: var(--sky-blue);
        }

        .btn-checkout {
            background: linear-gradient(135deg, var(--sky-blue), #2563EB);
            color: white;
            border: none;
            width: 100%;
            padding: 1.2rem;
            font-size: 1.1rem;
            font-weight: 600;
            border-radius: 12px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(37, 99, 235, 0.2);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
        }

        .btn-checkout:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 25px rgba(37, 99, 235, 0.3);
            background: linear-gradient(135deg, #38bdf8, #1d4ed8);
        }

        @media (max-width: 992px) {
            .checkout-page { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div id="toastContainer" class="toast-container"></div>

    <nav class="navbar glass scrolled" id="navbar">
        <div class="nav-left">
            <a href="index.html" class="logo">ELECTRO<span>COMPARE</span></a>
            <div class="nav-links">
                <a href="index.html" class="nav-item">Home</a>
                <a href="products.html" class="nav-item">Products</a>
            </div>
        </div>
        <div class="nav-actions">
            <a href="login.html" class="btn btn-outline">Cancel Checkout</a>
        </div>
    </nav>

    <div class="section-padding checkout-page">
        <div class="checkout-forms">
            
            <div class="checkout-section">
                <h3><i data-lucide="map-pin"></i> Shipping Address</h3>
                <div class="form-grid">
                    <div class="form-group">
                        <label>First Name</label>
                        <div class="input-wrapper">
                            <i data-lucide="user"></i>
                            <input type="text" id="firstNameInput" placeholder="John" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Last Name</label>
                        <div class="input-wrapper">
                            <i data-lucide="user"></i>
                            <input type="text" id="lastNameInput" placeholder="Doe" required>
                        </div>
                    </div>
                    <div class="form-group full">
                        <label>Street Address</label>
                        <div class="input-wrapper">
                            <i data-lucide="home"></i>
                            <input type="text" id="streetAddressInput" placeholder="123 Tech Avenue" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>City</label>
                        <div class="input-wrapper">
                            <i data-lucide="building"></i>
                            <input type="text" id="cityInput" placeholder="San Francisco" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>ZIP Code</label>
                        <div class="input-wrapper">
                            <i data-lucide="map"></i>
                            <input type="text" id="zipInput" placeholder="94105" required>
                        </div>
                    </div>
                </div>
            </div>

            <div class="checkout-section">
                <h3><i data-lucide="credit-card"></i> Payment Method</h3>
                
                <div class="cc-mockup">
                    <div class="cc-chip"></div>
                    <div style="font-family: monospace; font-size: 1.2rem; letter-spacing: 2px; margin-bottom: 1rem;">•••• •••• •••• 4242</div>
                    <div style="display: flex; justify-content: space-between; font-size: 0.8rem; text-transform: uppercase; color: #94a3b8;">
                        <span>John Doe</span>
                        <span>12/28</span>
                    </div>
                </div>

                <div class="form-grid">
                    <div class="form-group full">
                        <label>Card Number</label>
                        <div class="input-wrapper">
                            <i data-lucide="credit-card"></i>
                            <input type="text" placeholder="0000 0000 0000 0000" maxlength="19" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>Expiry Date</label>
                        <div class="input-wrapper">
                            <i data-lucide="calendar"></i>
                            <input type="text" placeholder="MM/YY" maxlength="5" required>
                        </div>
                    </div>
                    <div class="form-group">
                        <label>CVC</label>
                        <div class="input-wrapper">
                            <i data-lucide="lock"></i>
                            <input type="text" placeholder="123" maxlength="4" required>
                        </div>
                    </div>
                </div>
            </div>

        </div>

        <div class="cart-summary" style="top: 100px; height: fit-content; position: sticky; padding: 2.5rem; background: var(--white); border-radius: 24px; box-shadow: var(--shadow-soft); border: 1px solid #F1F5F9;">
            <h3 style="font-size: 1.4rem; margin-bottom: 1.5rem; border-bottom: 1px solid #E2E8F0; padding-bottom: 1rem;">Order Summary</h3>
            
            <div id="checkoutSummaryItems" style="margin-bottom: 2rem;">
                <!-- Dynamically populated -->
            </div>

            <div>
                <div class="summary-row" style="display: flex; justify-content: space-between; margin-bottom: 1rem; color: var(--muted-text);">
                    <span>Subtotal</span>
                    <span id="subtotalDisplay">₹0</span>
                </div>
                <div class="summary-row" style="display: flex; justify-content: space-between; margin-bottom: 1rem; color: var(--muted-text);">
                    <span>Shipping</span>
                    <span style="color: #10B981; font-weight: 600;">Free</span>
                </div>
                <div class="summary-row" style="display: flex; justify-content: space-between; margin-bottom: 1rem; color: var(--muted-text);">
                    <span>Tax (Est. 12%)</span>
                    <span id="taxDisplay">₹0</span>
                </div>
                <div class="summary-total" style="display: flex; justify-content: space-between; border-top: 1px solid #E2E8F0; padding-top: 1.5rem; margin-top: 1.5rem; font-size: 1.3rem; font-weight: 800; color: var(--dark-text);">
                    <span>Total</span>
                    <span id="finalTotalDisplay">₹0</span>
                </div>
                <button class="btn-checkout" onclick="placeOrder()">Place Order <i data-lucide="lock" size="18"></i></button>
            </div>
        </div>
    </div>

    <script src="/js/data.js"></script>
    <script src="/js/script.js"></script>
    <script>
        lucide.createIcons();

        function showToast(message, type = 'success') {
            const container = document.getElementById('toastContainer');
            if(!container) return;
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            const icon = type === 'error' ? 'alert-circle' : 'check-circle';
            toast.innerHTML = `
                <i data-lucide="${icon}"></i>
                <div class="toast-message">${message}</div>
            `;
            container.appendChild(toast);
            lucide.createIcons();
            setTimeout(() => toast.classList.add('show'), 10);
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 400); 
            }, 3000);
        }

        function placeOrder() {
            // Check if inputs are filled
            const inputs = document.querySelectorAll('input[required]');
            let allFilled = true;
            inputs.forEach(input => {
                if(!input.value) allFilled = false;
            });

            if(!allFilled) {
                showToast('Please fill in all required fields.', 'error');
                return;
            }

            const btn = document.querySelector('button[onclick="placeOrder()"]');
            btn.innerHTML = '<i data-lucide="loader" class="spin"></i> Processing...';
            lucide.createIcons();

            setTimeout(() => {
                showToast('Order Placed Successfully!', 'success');
                window.electroCart = [];
                localStorage.setItem('electro_cart', JSON.stringify([]));
                setTimeout(() => {
                    window.location.href = 'profile.html';
                }, 1500);
            }, 2000);
        }

        function renderCheckoutSummary() {
            const list = document.getElementById('checkoutSummaryItems');
            list.innerHTML = '';
            let subtotal = 0;

            if (window.electroCart.length === 0) {
                list.innerHTML = '<p>Your cart is empty.</p>';
            }

            window.electroCart.forEach(cartItem => {
                const product = window.productsData[cartItem.id];
                if(!product) return;
                subtotal += (product.price * cartItem.qty);

                const div = document.createElement('div');
                div.style.cssText = 'display: flex; gap: 1rem; margin-bottom: 1rem;';
                div.innerHTML = `
                    <img src="${product.image}" style="width: 50px; height: 50px; object-fit: contain; background: #F8FAFC; border-radius: 8px; padding: 0.5rem;" referrerpolicy="no-referrer">
                    <div>
                        <h4 style="font-size: 0.9rem;">${product.title}</h4>
                        <span style="color: var(--muted-text); font-size: 0.8rem;">Qty: ${cartItem.qty}</span>
                    </div>
                    <span style="margin-left: auto; font-weight: 600; font-size: 0.9rem;">₹${(product.price * cartItem.qty).toLocaleString('en-IN')}</span>
                `;
                list.appendChild(div);
            });

            const tax = Math.round(subtotal * 0.12);
            let total = subtotal + tax;

            document.getElementById('subtotalDisplay').innerText = '₹' + subtotal.toLocaleString('en-IN');
            document.getElementById('taxDisplay').innerText = '₹' + tax.toLocaleString('en-IN');
            document.getElementById('finalTotalDisplay').innerText = '₹' + total.toLocaleString('en-IN');
        }

        renderCheckoutSummary();

        // Auto-fill user info if logged in
        document.addEventListener('DOMContentLoaded', () => {
            const userStr = localStorage.getItem('electroUser');
            if (userStr) {
                try {
                    const user = JSON.parse(userStr);
                    if (user.firstName) document.getElementById('firstNameInput').value = user.firstName;
                    if (user.lastName) document.getElementById('lastNameInput').value = user.lastName;
                    if (user.address) document.getElementById('streetAddressInput').value = user.address;
                } catch(e) {}
            }
        });
    </script>
</body>
</html>
